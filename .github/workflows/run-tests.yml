name: Run QA Tests

on:
  pull_request:
    branches: [ main, master, develop ]
    paths:
      - 'problem-statement-1/**'
      - '.github/workflows/**'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.8'

    - name: Install dependencies
      working-directory: problem-statement-1
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Install Playwright browsers
      working-directory: problem-statement-1
      run: |
        playwright install

    - name: Run tests
      working-directory: problem-statement-1
      run: |
        pytest --browser chromium --headed=false --slowmo=0 -v
      env:
        CI: true